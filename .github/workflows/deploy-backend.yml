name: Deploy backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'deploy' }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/deploy/apps/chin_chin_backend' }}
      HEALTH_URL: ${{ vars.HEALTH_URL || 'http://127.0.0.1:4000/api/health' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

    steps:
      - name: Validate deployment secrets
        run: |
          test -n "$DEPLOY_HOST" || (echo "Missing DEPLOY_HOST secret" && exit 1)
          test -n "$DEPLOY_SSH_KEY" || (echo "Missing DEPLOY_SSH_KEY secret" && exit 1)

      - name: Normalize deployment settings
        run: |
          {
            echo "DEPLOY_HOST=$(printf '%s' \"$DEPLOY_HOST\" | tr -d '[:space:]\"\047')"
            echo "DEPLOY_USER=$(printf '%s' \"$DEPLOY_USER\" | tr -d '[:space:]\"\047')"
            echo "DEPLOY_PORT=$(printf '%s' \"$DEPLOY_PORT\" | tr -d '[:space:]\"\047')"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/chin_chin_deploy_key
          chmod 600 ~/.ssh/chin_chin_deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          ssh -i ~/.ssh/chin_chin_deploy_key \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' HEALTH_URL='$HEALTH_URL' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          echo "Pulling latest backend code..."
          git pull --ff-only origin main

          echo "Applying Prisma migrations..."
          docker compose -f compose.prod.yml --profile tools run --rm migrate

          echo "Rebuilding and restarting API..."
          docker compose -f compose.prod.yml up -d --build api

          echo "Checking containers..."
          docker compose -f compose.prod.yml ps

          echo "Checking backend health..."
          curl -fsS "$HEALTH_URL"
          echo
          REMOTE
